name: AI Onboard Refresh
description: 'Run get_started.py, bootstrap labels, and commit managed files'

inputs:
  github_token:
    description: 'GitHub token for label bootstrap'
    required: true
  github_repository:
    description: 'GitHub repository (owner/name)'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    - name: Run onboarding
      # Creates the .claude and standards symlinks and seeds requirements.txt.
      shell: bash
      run: python ai-coding-standards2/get_started.py --full --force

    - name: Bootstrap pipeline labels
      # Create the pipeline's status, trigger, and human-gate labels.
      # Idempotent; re-run after a submodule bump to pick up labels for newly
      # added agents.
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ inputs.github_repository }}
      run: |
        bash scripts/status.sh bootstrap-all pipeline/pipeline.json
        bash scripts/status.sh bootstrap-triggers
        python scripts/migrate_labels.py

    - name: Stage and commit managed files
      # Commits only non-workflow files -- the onboard token needs no workflow
      # scope. Force-stage the gitignored whole-folder symlinks (.claude and
      # standards). Falls back to a PR branch if direct push is blocked.
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add -f \
          .claude \
          standards \
          .gitignore

        git add adrs requirements.txt 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "OK: Already onboarded -- nothing to commit."
        else
          git commit -m "chore: AI onboarding -- wire up ai-coding-standards2"
          if git push origin HEAD 2>&1; then
            echo "OK: Pushed directly to the default branch."
          else
            SETUP_BRANCH="ai-standards-setup"
            git push origin HEAD:refs/heads/$SETUP_BRANCH --force
            echo ""
            echo "WARNING: Direct push was rejected (branch protection rules apply)."
            echo "   Branch '$SETUP_BRANCH' has been created with the setup commit."
            echo "   Open a pull request from that branch to complete onboarding."
          fi
        fi
