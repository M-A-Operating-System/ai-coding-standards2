name: AI Onboard Refresh
description: 'Run get_started.py, bootstrap labels, and commit managed files'

inputs:
  github_token:
    description: 'GitHub token for label bootstrap'
    required: true
  github_repository:
    description: 'GitHub repository (owner/name)'
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: '3.12'

    - name: Run onboarding
      # Creates the .claude and standards symlinks and seeds requirements.txt.
      shell: bash
      run: python ai-coding-standards2/get_started.py --full --force

    - name: Bootstrap pipeline labels
      # Create the pipeline's status, trigger, and human-gate labels.
      # Idempotent; re-run after a submodule bump to pick up labels for newly
      # added agents.
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ inputs.github_repository }}
      run: |
        bash scripts/status.sh bootstrap-all pipeline/pipeline.json
        bash scripts/status.sh bootstrap-triggers
        python scripts/migrate_labels.py

    - name: Stage and commit managed files
      # Force-stage the gitignored whole-folder symlinks (.claude and
      # standards), the two pipeline workflow files, and this job's own
      # composite action -- all three are rewritten on disk by the "Run
      # onboarding" step above and must be staged here or the rewrite is
      # silently discarded when the runner is torn down. Pushing a changed
      # .github/workflows/* file is something no `permissions:` setting can
      # grant the default GITHUB_TOKEN -- there is no "workflows" permission
      # key (GitHub rejects the whole workflow file if one is added). It
      # requires a PAT with the classic "workflow" OAuth scope, which is what
      # secrets.AI_AGILE_BOT_TOKEN supplies via the calling job's checkout
      # step. Falls back to a PR branch if direct push is blocked (missing
      # scope or branch protection, indistinguishable from here).
      #
      # Self-reference note: a composite action's steps are resolved once,
      # from the committed action.yml, when the job starts -- not re-read
      # mid-run. So staging .github/actions here (this file) never changes
      # what THIS run does; it only means the NEXT run picks up a newer
      # version. A consuming repo whose committed action.yml predates this
      # file's own git-add list (i.e. it never staged .github/ at all) can
      # never self-heal through Onboard/Bump alone -- nothing in the old
      # step adds .github/ to git, so get_started.py's on-disk rewrite of
      # this very file is discarded every run. Breaking that deadlock needs
      # one manual commit of the current submodule's action.yml (and the two
      # workflow files) directly to the consuming repo's default branch.
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add -f \
          .claude \
          standards \
          .gitignore \
          .github/workflows/ai_orchestrator.yml \
          .github/workflows/ai_emergency_stop.yml \
          .github/actions

        git add adrs requirements.txt .pipeline-stop 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "OK: Already onboarded -- nothing to commit."
        else
          git commit -m "chore: AI onboarding -- wire up ai-coding-standards2"
          if git push origin HEAD 2>&1; then
            echo "OK: Pushed directly to the default branch."
          else
            SETUP_BRANCH="ai-standards-setup"
            git push origin HEAD:refs/heads/$SETUP_BRANCH --force
            echo ""
            echo "WARNING: Direct push was rejected (branch protection rules apply)."
            echo "   Branch '$SETUP_BRANCH' has been created with the setup commit."
            echo "   Open a pull request from that branch to complete onboarding."
          fi
        fi
