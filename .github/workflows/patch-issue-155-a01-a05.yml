name: Patch issue-155 review findings A-01 to A-05
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-155
          fetch-depth: 0
          token: ${{ secrets.AI_AGILE_BOT_TOKEN }}
      - name: Apply all fixes
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py
      - name: Verify tests pass
        run: pip install pytest pyyaml jsonschema requests --quiet && cd pipeline && python -m pytest ../tests/ -q --tb=short 2>&1 | tail -8
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/pipeline_orchestrator.py pipeline/schemas/pipeline.schema.json docs/product/orchestrator/05-pipeline-config.md tests/test_orchestrator_logic.py
          git diff --cached --stat
          git commit -m "fix(post_steps): address review findings A-01 to A-05"
          git push origin issue-155
