name: Fix issue-7 merge conflicts (temp — delete after use)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-7
          fetch-depth: 0
          token: ${{ secrets.AI_AGILE_BOT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve merge conflicts
        run: |
          git fetch origin main
          git merge origin/main --no-edit || true

          # Take main's version of both files (removes conflict markers)
          git checkout --theirs \
            docs/product/agile/05-pipeline-config.md \
            docs/product/agile/generated/README.md

          # 05-pipeline-config.md: add generate_phase_mermaid.py alongside generate_docs.py
          # main has: `python pipeline/generators/generate_docs.py`.
          # we want:  `python pipeline/generators/generate_docs.py` and
          #           `python pipeline/generators/generate_phase_mermaid.py`.
          sed -i \
            's|`python pipeline/generators/generate_docs\.py`\.|`python pipeline/generators/generate_docs.py` and\n   `python pipeline/generators/generate_phase_mermaid.py`.|' \
            docs/product/agile/05-pipeline-config.md

          # generated/README.md: add phases/{phase}.mmd row after pipeline-pr.mmd row
          sed -i \
            '/pipeline-pr\.mmd.*generate_pipeline_mermaid/a | `phases/{phase}.mmd` (one per phase) | `pipeline/pipeline.json` | `pipeline/generators/generate_phase_mermaid.py` |' \
            docs/product/agile/generated/README.md

          # generated/README.md: add generate_phase_mermaid.py line after generate_pipeline_mermaid.py
          sed -i \
            '/^python pipeline\/generators\/generate_pipeline_mermaid\.py$/a python pipeline/generators/generate_phase_mermaid.py' \
            docs/product/agile/generated/README.md

          # Verify no conflict markers remain
          if grep -rn "^<<<<<<< \|^=======\|^>>>>>>> " \
               docs/product/agile/05-pipeline-config.md \
               docs/product/agile/generated/README.md; then
            echo "ERROR: conflict markers still present" >&2
            exit 1
          fi

          git add docs/product/agile/05-pipeline-config.md \
                  docs/product/agile/generated/README.md

          git diff --cached --quiet \
            && echo "Nothing to commit — conflicts already resolved" \
            || git commit -m "Merge main into issue-7: resolve ai-agile/pipeline path conflicts

Keeps pipeline/ paths from main (PR #78 structural refactor) and preserves
the generate_phase_mermaid.py additions from issue-7."

      - name: Push
        run: git push origin issue-7
