name: Fix issue-7 merge conflicts (temp — delete after use)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-issue-7-conflicts.yml']

permissions:
  contents: write

jobs:
  fix-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-7
          fetch-depth: 0
          token: ${{ secrets.AI_AGILE_BOT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase issue-7 onto main
        run: |
          # Reset issue-7 to match main exactly (no conflicts possible)
          git fetch origin main
          git reset --hard origin/main

          # Re-apply the per-phase mermaid additions from issue-7
          # 1) 05-pipeline-config.md: add generate_phase_mermaid.py call alongside generate_docs.py
          sed -i \
            's|`python pipeline/generators/generate_docs\.py`\.|`python pipeline/generators/generate_docs.py` and\n   `python pipeline/generators/generate_phase_mermaid.py`.|' \
            docs/product/agile/05-pipeline-config.md

          # 2) generated/README.md: add phases/{phase}.mmd row after pipeline-pr.mmd row
          sed -i \
            '/pipeline-pr\.mmd.*generate_pipeline_mermaid/a | `phases/{phase}.mmd` (one per phase) | `pipeline/pipeline.json` | `pipeline/generators/generate_phase_mermaid.py` |' \
            docs/product/agile/generated/README.md

          # 3) generated/README.md: add generate_phase_mermaid.py command after generate_pipeline_mermaid.py
          sed -i \
            '/^python pipeline\/generators\/generate_pipeline_mermaid\.py$/a python pipeline/generators/generate_phase_mermaid.py' \
            docs/product/agile/generated/README.md

          git add docs/product/agile/05-pipeline-config.md \
                  docs/product/agile/generated/README.md

          git diff --cached --quiet \
            && echo "Nothing to commit — already up to date" \
            || git commit -m "Apply issue-7 per-phase mermaid additions onto current main

Rebases generate_phase_mermaid.py documentation additions from issue-7
onto main current pipeline/ paths (after PR #78 structural refactor)."

      - name: Push
        run: git push --force-with-lease origin issue-7
