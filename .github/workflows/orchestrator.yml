name: Pipeline Orchestrator

on:
  # Issue lifecycle events — opened/reopened brings new work in;
  # labeled/unlabeled is the primary advance trigger.
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

  # Catch anything the label events missed (agent took time, etc.)
  schedule:
    - cron: '*/15 6-20 * * 1-5'  # Every 15 min, 06:00–20:00 UTC, weekdays

  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Process a single issue/PR number (leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run — show what would trigger without executing'
        type: boolean
        default: false

# Only one orchestrator run at a time. A second trigger queues and runs
# after the first completes — prevents two runs from both seeing an agent
# as not-:wip and invoking it concurrently.
concurrency:
  group: pipeline-orchestrator
  cancel-in-progress: false

# Permissions are declared per-job below. No workflow-level defaults.
# This enforces the least-privilege split:
#   pre-execute  contents:read  — agents that only post comments / labels
#   execute      contents:write — agents that push branches and create PRs
#
# Security note: the execute job carries contents:write. If you are running
# this pipeline on a public repository, an attacker who can open issues may
# be able to craft a prompt-injection payload that reaches the coder agent.
# See docs/product/agile/README.md for the full security guidance.

jobs:
  # ── Pre-execute ────────────────────────────────────────────────────────────
  # Runs phases: 00_ondemand, 01_product_docs, 02_design
  # These agents only post comments, rewrite issue bodies, and apply labels.
  # contents:read means a compromised agent cannot push code to the repo.
  # Trade-off: audit-log events from these phases are dropped (the GitHub
  # Contents API requires contents:write; the exception is caught and logged).
  pre-execute:
    name: Evaluate pipeline state (pre-execute phases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
    env:
      PIPELINE_PHASES: "00_ondemand,01_product_docs,02_design"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build orchestrator args
        id: args
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""

          [[ "$ISSUE_INPUT" =~ ^[0-9]*$ ]] || { echo "ERROR: issue_number must be a positive integer" >&2; exit 1; }

          if [ -n "$ISSUE_INPUT" ]; then
            ARGS="$ARGS --issue $ISSUE_INPUT"
          elif [ "$EVENT_NAME" = "issues" ]; then
            ARGS="$ARGS --issue $EVENT_ISSUE_NUMBER --kind issue"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            ARGS="$ARGS --issue $EVENT_PR_NUMBER --kind pr"
          fi

          if [ "$EVENT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator (pre-execute phases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGILE_BOT_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          # Consuming repo root — agents resolve $AI_AGILE_ROOT/standards/
          # and $AI_AGILE_ROOT/.claude/agents/ from here.
          AI_AGILE_ROOT: ${{ github.workspace }}
          # ci-gate uses this to exclude all orchestrator check runs from its poll.
          CI_GATE_EXCLUDE_JOB_NAMES: "Evaluate pipeline state (pre-execute phases)\nEvaluate pipeline state (execute phases)"
          ORCHESTRATOR_ARGS: ${{ steps.args.outputs.args }}
        run: |
          python pipeline/pipeline_orchestrator.py \
            --repo "$GITHUB_REPOSITORY" \
            --verbose \
            --phases "$PIPELINE_PHASES" \
            $ORCHESTRATOR_ARGS

  # ── Execute ────────────────────────────────────────────────────────────────
  # Runs phases: 03_execute, 04_evaluate, 05_continuous
  # The coder agent pushes branches and creates PRs — contents:write required.
  # This job is the higher-risk tier. Only reachable after human gates in the
  # pre-execute phases have approved the work (prd-writer:approved, etc.).
  execute:
    name: Evaluate pipeline state (execute phases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    env:
      PIPELINE_PHASES: "03_execute,04_evaluate,05_continuous"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build orchestrator args
        id: args
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""

          [[ "$ISSUE_INPUT" =~ ^[0-9]*$ ]] || { echo "ERROR: issue_number must be a positive integer" >&2; exit 1; }

          if [ -n "$ISSUE_INPUT" ]; then
            ARGS="$ARGS --issue $ISSUE_INPUT"
          elif [ "$EVENT_NAME" = "issues" ]; then
            ARGS="$ARGS --issue $EVENT_ISSUE_NUMBER --kind issue"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            ARGS="$ARGS --issue $EVENT_PR_NUMBER --kind pr"
          fi

          if [ "$EVENT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator (execute phases)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGILE_BOT_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          # Consuming repo root — agents resolve $AI_AGILE_ROOT/standards/
          # and $AI_AGILE_ROOT/.claude/agents/ from here.
          AI_AGILE_ROOT: ${{ github.workspace }}
          # ci-gate uses this to exclude all orchestrator check runs from its poll.
          CI_GATE_EXCLUDE_JOB_NAMES: "Evaluate pipeline state (pre-execute phases)\nEvaluate pipeline state (execute phases)"
          ORCHESTRATOR_ARGS: ${{ steps.args.outputs.args }}
        run: |
          python pipeline/pipeline_orchestrator.py \
            --repo "$GITHUB_REPOSITORY" \
            --verbose \
            --phases "$PIPELINE_PHASES" \
            $ORCHESTRATOR_ARGS
