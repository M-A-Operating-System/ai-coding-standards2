name: Pipeline Orchestrator

on:
  # Issue lifecycle events — opened/reopened brings new work in;
  # labeled/unlabeled is the primary advance trigger.
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

  # Catch anything the label events missed (agent took time, etc.)
  schedule:
    - cron: '*/15 6-20 * * 1-5'  # Every 15 min, 06:00–20:00 UTC, weekdays

  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Process a single issue/PR number (leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run — show what would trigger without executing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

# Only one orchestrator run at a time. A second trigger queues and runs
# after the first completes — prevents two runs from both seeing an agent
# as not-:wip and invoking it concurrently.
concurrency:
  group: pipeline-orchestrator
  cancel-in-progress: false

jobs:
  ai-standards-orchestrator:
    name: Evaluate pipeline state
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build orchestrator args
        id: args
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
        run: |
          ARGS=""

          [[ "$ISSUE_INPUT" =~ ^[0-9]*$ ]] || { echo "ERROR: issue_number must be a positive integer" >&2; exit 1; }

          if [ -n "$ISSUE_INPUT" ]; then
            ARGS="$ARGS --issue $ISSUE_INPUT"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            ARGS="$ARGS --issue ${{ github.event.issue.number }} --kind issue"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS --issue ${{ github.event.pull_request.number }} --kind pr"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGILE_BOT_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          GIT_TRACE: "1"
          # Consuming repo root — agents resolve $AI_AGILE_ROOT/standards/
          # and $AI_AGILE_ROOT/.claude/agents/ from here.
          AI_AGILE_ROOT: ${{ github.workspace }}
          # ci-gate uses this to exclude all orchestrator check runs from its poll.
          # List every job display name in this workflow (newline-separated).
          # The live-query fallback in ci-gate.sh keeps this in sync automatically,
          # but having it here avoids the extra API call and works even if the query fails.
          CI_GATE_EXCLUDE_JOB_NAMES: "Evaluate pipeline state"
        run: |
          python pipeline/pipeline_orchestrator.py \
            --repo "$GITHUB_REPOSITORY" \
            --verbose \
            ${{ steps.args.outputs.args }}
