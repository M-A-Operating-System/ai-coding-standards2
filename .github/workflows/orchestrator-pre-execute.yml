name: Pipeline Orchestrator (pre-execute)

# Runs phases: 00_ondemand, 01_product_docs, 02_design
# These agents only post comments, rewrite issue bodies, and apply labels.
# contents:read means a compromised agent cannot push code to the repo even
# if a prompt-injection attack succeeds.
#
# Trade-off: audit-log events from these phases are dropped because the
# GitHub Contents API requires contents:write. The exception is caught and
# logged as a warning by the orchestrator.
#
# Security note: if you are running this pipeline on a public repository,
# see docs/product/agile/README.md for the full security guidance.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

  # Catch anything the label events missed (agent took time, etc.)
  schedule:
    - cron: '*/15 6-20 * * 1-5'  # Every 15 min, 06:00–20:00 UTC, weekdays

  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Process a single issue/PR number (leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run — show what would trigger without executing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

# Only one pre-execute run at a time.
concurrency:
  group: pipeline-pre-execute
  cancel-in-progress: false

jobs:
  pre-execute:
    name: Evaluate pipeline state (pre-execute phases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIPELINE_PHASES: "00_ondemand,01_product_docs,02_design"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build orchestrator args
        id: args
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""

          [[ "$ISSUE_INPUT" =~ ^[0-9]*$ ]] || { echo "ERROR: issue_number must be a positive integer" >&2; exit 1; }

          if [ -n "$ISSUE_INPUT" ]; then
            ARGS="$ARGS --issue $ISSUE_INPUT"
          elif [ "$EVENT_NAME" = "issues" ]; then
            ARGS="$ARGS --issue $EVENT_ISSUE_NUMBER --kind issue"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            ARGS="$ARGS --issue $EVENT_PR_NUMBER --kind pr"
          fi

          if [ "$EVENT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGILE_BOT_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          AI_AGILE_ROOT: ${{ github.workspace }}
          CI_GATE_EXCLUDE_JOB_NAMES: "Evaluate pipeline state (pre-execute phases)\nEvaluate pipeline state (execute phases)"
          ORCHESTRATOR_ARGS: ${{ steps.args.outputs.args }}
        run: |
          read -ra EXTRA_ARGS <<< "$ORCHESTRATOR_ARGS"
          python pipeline/pipeline_orchestrator.py \
            --repo "$GITHUB_REPOSITORY" \
            --verbose \
            --phases "$PIPELINE_PHASES" \
            "${EXTRA_ARGS[@]}"
