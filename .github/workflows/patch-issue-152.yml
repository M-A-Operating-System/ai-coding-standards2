name: "patch-issue-152: DP-001 + SC-001"
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-152
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patches
        run: |
          python3 - << 'PYEOF'
          path = "pipeline/pipeline_orchestrator.py"
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          # SC-001: fix doc path
          old_sc = '"""Build one audit event per the schema in docs/product/agile/08-audit-log.md."""'
          new_sc = '"""Build one audit event per the schema in docs/product/orchestrator/08-audit-log.md."""'
          assert old_sc in src, "SC-001 target not found"
          src = src.replace(old_sc, new_sc, 1)

          # DP-001: wrap print in try/except
          old_dp = '    print(json.dumps(event, separators=(",", ":")), flush=True)\n'
          new_dp = (
              '    try:\n'
              '        print(json.dumps(event, separators=(",", ":")), flush=True)\n'
              '    except Exception as exc:\n'
              '        log.warning("could not emit audit event: %s", exc)\n'
          )
          # Only replace inside _emit_audit_event (the one after the def line)
          marker = 'def _emit_audit_event(event: dict) -> None:\n'
          idx = src.index(marker)
          after = src[idx:]
          assert old_dp in after, "DP-001 target not found"
          after = after.replace(old_dp, new_dp, 1)
          src = src[:idx] + after

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("patches applied")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/pipeline_orchestrator.py
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "fix: DP-001+SC-001 audit event hardening (doc path + BrokenPipe guard)"
          git push origin issue-152
