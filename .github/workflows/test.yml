name: Tests
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/pipeline_orchestrator.py'
      - 'tests/**'
  pull_request:
    paths:
      - 'pipeline/pipeline_orchestrator.py'
      - 'tests/**'
permissions:
  contents: read
jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest requests
      - name: Run tests
        run: pytest tests/ -v
