name: Sync AI Agile .claude directory

# Keeps the consuming repo's whole .claude and standards folders in sync
# with whatever version of the ai-coding-standards2 submodule is currently
# pinned. Runs daily to catch any drift, and can be triggered on demand.
#
# On Linux runners get_started.py creates whole-folder directory symlinks
# for .claude and standards (pointing into the submodule). Each symlink is
# committed as a tiny git blob so developers who clone the consuming repo
# inherit the framework's Claude setup and standards without running
# get_started.py. The parent keeps no Claude config of its own.
#
# The consuming repo's own files -- adrs/ (project ADRs) -- live OUTSIDE the
# symlinked folders and are never overwritten by sync.
#
# The .claude and standards paths are listed in .gitignore (so Windows file
# copies are not committed by hand). The workflow uses `git add -f` to
# force-stage the symlink blobs despite the .gitignore rule.
#
# This workflow is installed into consuming repos by get_started.py.
# Do NOT edit it directly in the consuming repo -- edit the source at
# ai-coding-standards2/.github/workflows/ai_sync_claude.yml and re-run
# get_started.py --full --force (or wait for the next daily sync).

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-claude
  cancel-in-progress: true

jobs:
  ai-standards-sync:
    name: Sync .claude from ai-coding-standards2 submodule
    # This workflow is designed for consuming repos that have ai-coding-standards2
    # as a submodule. Skip when running in the source repo itself.
    if: github.repository != 'M-A-Operating-System/ai-coding-standards2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          submodules: true
          # Use AI_AGILE_BOT_TOKEN so the commit is attributed to the bot
          # and so branch-protection rules that block GITHUB_TOKEN pushes
          # are bypassed. Falls back to GITHUB_TOKEN if the secret is absent.
          token: ${{ secrets.AI_AGILE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Sync Claude setup, standards, and workflows
        # --force overwrites anything that drifted from the submodule. On Linux
        # this creates whole-folder .claude and standards symlinks instead of
        # copying files. Also adds/updates .gitignore entries and removes any
        # previously-tracked managed paths from the git index.
        run: python ai-coding-standards2/get_started.py --full --force

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-stage the whole-folder symlinks despite .gitignore (the
          # gitignore rule protects developers from accidentally committing
          # Windows copies; the sync workflow is the authoritative committer on
          # Linux).
          #
          # .claude / standards -- symlinks on Linux (no trailing slash; git
          #   add -f stages the symlink blob, not the directory contents).
          # Workflows -- always committed (GitHub Actions requires them here).
          git add -f \
            .claude \
            standards \
            .gitignore \
            .github/workflows/ai_orchestrator.yml \
            .github/workflows/ai_bootstrap_labels.yml \
            .github/workflows/ai_label_cleanup.yml \
            .github/workflows/ai_sync_claude.yml

          # Project-owned artifacts, committed normally (not gitignored).
          git add adrs requirements.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "OK: .claude is already in sync with the submodule -- nothing to commit."
          else
            git commit -m "chore: sync .claude and workflows from ai-coding-standards2 submodule"
            git push origin HEAD
          fi
