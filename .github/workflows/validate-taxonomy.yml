name: Validate taxonomy

on:
  pull_request:
    paths:
      - 'taxonomy/**'
      - 'pipeline/validate_taxonomy.py'
      - '.github/workflows/validate-taxonomy.yml'
  push:
    branches: [main]
    paths:
      - 'taxonomy/**'
      - 'pipeline/validate_taxonomy.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate taxonomy JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install jsonschema

      - name: Run validator
        run: python pipeline/validate_taxonomy.py
