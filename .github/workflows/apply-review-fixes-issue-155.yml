name: Apply review fixes to issue-155
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-155
          fetch-depth: 0
          token: ${{ secrets.AI_AGILE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Patch pipeline_orchestrator.py
        run: |
          python3 - << 'PYEOF'
          with open('pipeline/pipeline_orchestrator.py') as f:
              src = f.read()

          # 1. Add review_gate field to AgentDef
          old = '    post_steps: list = field(default_factory=list)  # repo-relative script paths run after :complete\n    commit_after: bool = False'
          new = '    post_steps: list = field(default_factory=list)  # repo-relative script paths run after :complete\n    review_gate: bool = False             # True only for the agent that gates human review (pr-reviewer); controls free-reinvoke on unresolved human REQUEST_CHANGES\n    commit_after: bool = False'
          assert old in src, 'AgentDef post_steps field not found'
          src = src.replace(old, new, 1)

          # 2. Load review_gate in load_pipeline
          old = '                post_steps=list(entry.get("post_steps", [])),\n                commit_after=bool(entry.get("git_ops", {}).get("commit_after", False)),'
          new = '                post_steps=list(entry.get("post_steps", [])),\n                review_gate=bool(entry.get("review_gate", False)),\n                commit_after=bool(entry.get("git_ops", {}).get("commit_after", False)),'
          assert old in src, 'load_pipeline post_steps line not found'
          src = src.replace(old, new, 1)

          # 3. Replace bool(post_steps) guards with review_gate (both occurrences)
          src = src.replace(
              'and bool(agent_def.post_steps)\n                and agent_def.review_loop',
              'and agent_def.review_gate\n                and agent_def.review_loop'
          )
          assert 'bool(agent_def.post_steps)' not in src, 'Still has bool(post_steps) guard'

          # 4. Add AI_AGILE_ROOT to _ps_env
          old = '                if work_item.kind == "issue":\n                    _ps_env["ISSUE_NUMBER"] = str(work_item.number)\n                else:\n                    _ps_env["PR_NUMBER"] = str(work_item.number)'
          new = '                if work_item.kind == "issue":\n                    _ps_env["ISSUE_NUMBER"] = str(work_item.number)\n                else:\n                    _ps_env["PR_NUMBER"] = str(work_item.number)\n                _ps_env["AI_AGILE_ROOT"] = os.environ.get("AI_AGILE_ROOT", str(SUBMODULE_ROOT))'
          assert old in src, '_ps_env ISSUE_NUMBER block not found'
          src = src.replace(old, new, 1)

          with open('pipeline/pipeline_orchestrator.py', 'w') as f:
              f.write(src)
          print('pipeline_orchestrator.py patched OK')
          PYEOF
      - name: Patch tests/test_orchestrator_logic.py
        run: |
          python3 - << 'PYEOF'
          with open('tests/test_orchestrator_logic.py') as f:
              src = f.read()

          # 1. Rename class
          src = src.replace('class TestMarkReadyOnComplete:', 'class TestPostSteps:', 1)

          # 2. Add review_gate=True to _agent() helper
          old = '            post_steps=[".github/scripts/mark-pr-ready.sh"],\n        )'
          new = '            post_steps=[".github/scripts/mark-pr-ready.sh"],\n            review_gate=True,\n        )'
          assert old in src, '_agent() helper post_steps line not found'
          src = src.replace(old, new, 1)

          # 3. Add env assertions after the bash_calls[0] script name check
          old = '        assert "mark-pr-ready.sh" in bash_calls[0].args[0][-1]\n\n    @patch("pipeline_orchestrator.invoke_agent")\n    def test_does_not_run_post_steps_on_review'
          new = '        assert "mark-pr-ready.sh" in bash_calls[0].args[0][-1]\n        env_passed = bash_calls[0].kwargs["env"]\n        assert env_passed["WORK_ITEM_KIND"] == "pr"\n        assert env_passed["WORK_ITEM_NUMBER"] == "55"\n        assert env_passed["PR_NUMBER"] == "55"\n        assert "REPO" in env_passed\n        assert "AI_AGILE_ROOT" in env_passed\n\n    @patch("pipeline_orchestrator.invoke_agent")\n    def test_does_not_run_post_steps_on_review'
          assert old in src, 'bash_calls assert line not found'
          src = src.replace(old, new, 1)

          # 4. Fix broad Path.exists patches in multi-step tests (first occurrence)
          old = '        with patch("subprocess.run", side_effect=self._sub_side_effect_factory(bash_ok)) as mock_sub, \\\n             patch("pathlib.Path.exists", return_value=True):'
          new = '        def _exists_for_scripts(self_path):\n            return any(s in str(self_path) for s in ("mark-pr-ready.sh", "other-hook.sh"))\n\n        with patch("subprocess.run", side_effect=self._sub_side_effect_factory(bash_ok)) as mock_sub, \\\n             patch("pathlib.Path.exists", _exists_for_scripts):'
          assert old in src, 'multi-step subprocess patch not found'
          src = src.replace(old, new, 1)

          # 5. Fix broad Path.exists patch in break test
          old = '        with patch("subprocess.run", side_effect=_side_effect), \\\n             patch("pathlib.Path.exists", return_value=True):'
          new = '        def _exists_for_scripts(self_path):\n            return any(s in str(self_path) for s in ("mark-pr-ready.sh", "other-hook.sh"))\n\n        with patch("subprocess.run", side_effect=_side_effect), \\\n             patch("pathlib.Path.exists", _exists_for_scripts):'
          assert old in src, 'break test subprocess patch not found'
          src = src.replace(old, new, 1)

          with open('tests/test_orchestrator_logic.py', 'w') as f:
              f.write(src)
          print('test_orchestrator_logic.py patched OK')
          PYEOF
      - name: Verify tests pass
        run: pip install pytest pyyaml jsonschema requests && pytest tests/ -q --tb=short 2>&1 | tail -5
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/pipeline_orchestrator.py tests/test_orchestrator_logic.py
          git diff --cached --stat
          git commit -m "fix(post_steps): review_gate field, AI_AGILE_ROOT env, test class rename and assertions"
          git push origin issue-155
