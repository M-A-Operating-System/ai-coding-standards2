name: Label cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — show what would be deleted without deleting'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  ai-standards-label-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          submodules: true

      - name: Prune stale pipeline labels
        env:
          GITHUB_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(pipeline/pipeline.json)
          [ "$DRY_RUN_INPUT" = "true" ] && ARGS+=(--dry-run)
          bash .github/scripts/status.sh prune "${ARGS[@]}"

      - name: Bootstrap correct labels
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash .github/scripts/status.sh bootstrap-all \
            pipeline/pipeline.json
