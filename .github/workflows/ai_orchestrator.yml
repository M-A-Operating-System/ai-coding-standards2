name: AI - Orchestrator

# Single orchestrator workflow -- evaluates every pipeline phase in one pass.
#
# The orchestrator loads all agents from pipeline.json and processes whichever
# work items are eligible, in dependency order, across every phase. Running the
# whole pipeline in one workflow means cross-phase dependencies always resolve
# (an agent in 03_execute can depend on one in 01_product_docs) and there is a
# single concurrency group, so runs queue rather than race.
#
# Permissions: contents:write is required because the coder pushes branches,
# create-pr opens PRs, and prd-docs-updater commits doc changes to the issue
# branch. The execute-phase agents are only reachable after the human gates in
# the earlier phases (prd-writer:approved, etc.) have approved the work.
#
# Security note: if you are running this pipeline on a public repository, an
# attacker who can open issues may be able to craft a prompt-injection payload
# that reaches the coder agent after gates are approved. See
# docs/product/orchestrator/README.md for the full security guidance.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]

  # Periodic backstop that catches anything the event triggers missed (an agent
  # that took a long time, a run that never fired on an event, etc.). Runs twice
  # a day at 06:00 and 18:00 UTC. The issues/pull_request event triggers above
  # still fire the orchestrator in real time -- this sweep is only the safety net
  # for work those events did not pick up, so lowering its cadence does not delay
  # event-driven pipeline progress. Times are UTC (GitHub Actions crons are
  # always UTC); shift the hours if a local schedule is intended.
  schedule:
    - cron: '0 6,18 * * *'  # 06:00 and 18:00 UTC (every 12h)

  workflow_dispatch:
    inputs:
      onboard:
        description: 'Onboard -- wire up agents, commands, and workflows from the submodule'
        type: boolean
        default: false
      issue_number:
        description: 'Process a single issue/PR number (leave blank for all)'
        required: false
      dry_run:
        description: 'Dry run -- show what would trigger without executing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read

# Only one orchestrator run at a time -- concurrent triggers queue.
concurrency:
  group: pipeline-orchestrator
  cancel-in-progress: false

jobs:
  # --- Onboard ----------------------------------------------------------------
  # Run this job once after get_started.py --seed has copied the two pipeline
  # workflows (ai_orchestrator.yml, ai_emergency_stop.yml):
  #   Actions -> AI - Orchestrator -> Run workflow -> OK: Onboard
  # It calls get_started.py --full --force on a Linux runner, which creates the
  # .claude and standards symlinks, seeds adrs/ and requirements, bootstraps the
  # pipeline labels, then commits and pushes the NON-workflow files. It never
  # pushes a .github/workflows/* file, so the token needs no workflow scope.
  # After this job completes, open an issue to start the normal pipeline.
  onboard:
    name: Onboard
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.onboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          token: ${{ secrets.AI_AGILE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Run onboarding
        # Creates the .claude and standards symlinks, copies nothing else that
        # is a workflow file: the two pipeline workflows (ai_orchestrator,
        # ai_emergency_stop) were committed during the seed step. Seeds
        # requirements.txt and updates .gitignore.
        run: python ai-coding-standards2/get_started.py --full --force

      - name: Bootstrap pipeline labels
        # Create the pipeline's status, trigger, and human-gate labels. Uses the
        # default GITHUB_TOKEN (issues: write) -- labels do not need a
        # workflow-scoped token. Idempotent; re-run onboarding after a submodule
        # upgrade to pick up labels for any newly added agents.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Bare paths -- get_started's rewrite_paths prefixes them with the
        # submodule dir name on copy, so this stays correct if the consuming
        # repo checks the submodule out under a different name.
        run: |
          bash .github/scripts/status.sh bootstrap-all pipeline/pipeline.json
          bash .github/scripts/status.sh bootstrap-triggers
          python .github/scripts/migrate_labels.py

      - name: Stage and commit managed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit ONLY non-workflow files. The two pipeline workflows were
          # committed during the seed step, so this job never pushes a
          # .github/workflows/* file -- which means the token here needs no
          # workflow scope; the default GITHUB_TOKEN suffices. Force-stage the
          # gitignored whole-folder symlinks (.claude and standards).
          git add -f \
            .claude \
            standards \
            .gitignore

          # Project-owned artifacts, committed normally (not gitignored):
          # local ADRs and requirements.txt.
          git add adrs requirements.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "OK: Already onboarded -- nothing to commit."
          else
            git commit -m "chore: AI onboarding -- wire up ai-coding-standards2"
            # Try a direct push first. If branch protection rules block it,
            # fall back to a PR branch so the commit is not lost.
            if git push origin HEAD 2>&1; then
              echo "OK: Pushed directly to the default branch."
            else
              SETUP_BRANCH="ai-standards-setup"
              git push origin HEAD:refs/heads/$SETUP_BRANCH --force
              echo ""
              echo "WARNING: Direct push was rejected (branch protection rules apply)."
              echo "   Branch '$SETUP_BRANCH' has been created with the setup commit."
              echo "   Open a pull request from that branch to complete onboarding."
            fi
          fi

  # --- Emergency-stop check ---------------------------------------------------
  # Checks for .pipeline-stop via the Contents API only -- no checkout, no
  # Python, no npm install. Lets a stopped pipeline's triggers resolve to a
  # green, skipped run in a few seconds instead of paying for a full runner
  # setup only to have the orchestrator's own is_pipeline_stopped() check
  # (pipeline_orchestrator.py) bail out after the expensive steps already ran.
  # This is a cost optimisation, not the authoritative check: the orchestrator
  # still re-checks the marker itself once the working tree is checked out, so
  # a transient API failure here (treated as "not stopped") never causes a
  # real stop to be missed -- it only costs one wasted expensive run at worst.
  check-stop:
    name: Check for emergency stop marker
    if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.onboard == 'true')"
    runs-on: ubuntu-latest
    # A single gh api call should finish in seconds. Bounding it tightly means
    # a hung/stalled call can never quietly burn hours of runner time -- which
    # would defeat this job's whole cost-saving purpose in its own failure mode.
    timeout-minutes: 5
    outputs:
      stopped: ${{ steps.check.outputs.stopped }}
    steps:
      - name: Check .pipeline-stop via the Contents API
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/.pipeline-stop" >/dev/null 2>&1; then
            echo "stopped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::.pipeline-stop marker present -- skipping the orchestrator run."
          else
            echo "stopped=false" >> "$GITHUB_OUTPUT"
          fi

  # --- Normal pipeline operation ----------------------------------------------
  orchestrate:
    name: Evaluate pipeline state
    needs: check-stop
    if: "!(github.event_name == 'workflow_dispatch' && github.event.inputs.onboard == 'true') && needs.check-stop.outputs.stopped != 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.185

      - name: Build orchestrator args
        id: args
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""

          [[ "$ISSUE_INPUT" =~ ^[0-9]*$ ]] || { echo "ERROR: issue_number must be a positive integer" >&2; exit 1; }

          if [ -n "$ISSUE_INPUT" ]; then
            ARGS="$ARGS --issue $ISSUE_INPUT"
          elif [ "$EVENT_NAME" = "issues" ]; then
            ARGS="$ARGS --issue $EVENT_ISSUE_NUMBER --kind issue"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            ARGS="$ARGS --issue $EVENT_PR_NUMBER --kind pr"
          fi

          if [ "$EVENT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_AGILE_BOT_TOKEN: ${{ secrets.AI_AGILE_BOT_TOKEN }}
          AI_AGILE_ROOT: ${{ github.workspace }}
          CI_GATE_EXCLUDE_JOB_NAMES: "Evaluate pipeline state"
          ORCHESTRATOR_ARGS: ${{ steps.args.outputs.args }}
          ORCHESTRATOR_DEBUG: ${{ vars.ORCHESTRATOR_DEBUG }}
        run: |
          read -ra EXTRA_ARGS <<< "$ORCHESTRATOR_ARGS"
          DEBUG_FLAG=""
          [ "${ORCHESTRATOR_DEBUG:-false}" = "true" ] && DEBUG_FLAG="--verbose"
          python pipeline/pipeline_orchestrator.py \
            --repo "$GITHUB_REPOSITORY" \
            ${DEBUG_FLAG} \
            "${EXTRA_ARGS[@]}"
