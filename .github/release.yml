# Configuration for GitHub's auto-generated release notes
# (`gh release create --generate-notes`, used by the RELEASE - publish
# workflow). Merged PRs are grouped into the categories below by their labels.
#
# Pipeline PRs carry a `classification: {type}` label copied from the issue
# by link-pr-to-issue.sh. A PR lands in the first category whose labels it
# matches; anything unmatched falls through to the catch-all "Other" category
# (hand-authored PRs that skip the pipeline remain unlabeled and land there).
changelog:
  exclude:
    labels:
      - dependencies
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - "classification: feature"
        - "classification: enhancement"
    - title: Fixes
      labels:
        - "classification: bug"
    - title: Maintenance
      labels:
        - "classification: toil"
    - title: Other
      labels:
        - "*"
